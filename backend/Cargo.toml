[package]
name = "magic-cloud"
version = "1.0.1"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["fs", "limit"] }
rusqlite = { version = "0.43", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
argon2 = "0.5"
rand = "0.8"
libc = "0.2"
futures-util = "0.3"
mime_guess = "2"
percent-encoding = "2"
subtle = "2"
chacha20poly1305 = "0.10"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
