name: magic-cloud
services:
  magic-cloud:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CARGO_BUILD_JOBS: 2
    image: magic-cloud:local
    container_name: magic-cloud
    labels:
      description: "麦吉云"
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    init: true
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      APP_ORIGIN: ${APP_ORIGIN:?Set HTTPS origin}
      STORAGE_ID: ${STORAGE_ID:?Initialize storage first}
      STORAGE_ROOT: /data
      TRUSTED_PROXY_IP: 172.30.56.3
      PORT: ${PORT:-5080}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      SAFETY_MARGIN_BYTES: ${SAFETY_MARGIN_BYTES:-2147483648}
      SAFETY_MARGIN_PERCENT: ${SAFETY_MARGIN_PERCENT:-5}
    volumes:
      - type: bind
        source: ${STORAGE_MOUNT:?Set STORAGE_MOUNT}
        target: /data
        bind:
          create_host_path: false
    networks:
      tunnel:
        ipv4_address: 172.30.56.2
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent "http://127.0.0.1:$${PORT}/health/ready"']
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 30s
    mem_limit: 2g
    cpus: 2
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: magic-cloud-cloudflared-tunnel
    labels:
      description: "Cloudflare 内网穿透隧道"
    # Use the complete connector token, not the tunnel UUID.
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:?Set the full Tunnel Token in .env (not Tunnel ID)}
    restart: unless-stopped
    networks:
      tunnel:
        ipv4_address: 172.30.56.3
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
networks:
  tunnel:
    ipam:
      config:
        - subnet: 172.30.56.0/29
